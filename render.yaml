# Render Blueprint: render.com üzerinde "New +" -> "Blueprint" ile bu depoyu bağlayınca
# otomatik algılanır. DATABASE_URL ve SECRET_KEY, Render panelinden elle girilmelidir
# (sync: false olduğu için buraya yazılmaz, deploy sırasında panel sorar).
services:
  - type: web
    name: ne-pisirsek-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.2
